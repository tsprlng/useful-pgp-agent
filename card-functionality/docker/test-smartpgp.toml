[card.smartpgp]
backend.pcsc = "FFFF:00001234"
config.keygen = [
    "RSA2k/17", "RSA3k/17", "RSA4k/17",
    "NIST256", "NIST384", "NIST521"
]
config.import = [
    "data/rsa2k.sec",
    "data/rsa3k.sec",
    "data/rsa4k.sec",
    "data/nist256.sec",
    "data/nist384.sec",
    "data/nist521.sec"
]

