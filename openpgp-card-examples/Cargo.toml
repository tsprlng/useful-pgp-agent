[package]
name = "openpgp-card-examples"
description = "Examples and demos of apps utilizing openpgp-card-sequoia"
license = "MIT OR Apache-2.0"
version = "0.0.1"
authors = ["Wiktor Kwapisiewicz <wiktor@metacode.biz>"]
edition = "2018"
repository = "https://gitlab.com/hkos/openpgp-card"
documentation = "https://docs.rs/crate/openpgp-card-examples"

[dependencies]
sequoia-openpgp = "1.3"
nettle = "7"
openpgp-card = { path = "../openpgp-card", version = "0.1" }
openpgp-card-pcsc = { path = "../pcsc", version = "0.1" }
openpgp-card-sequoia = { path = "../openpgp-card-sequoia", version = "0.0.7" }
chrono = "0.4"
anyhow = "1"
thiserror = "1"
env_logger = "0.8"
log = "0.4"
