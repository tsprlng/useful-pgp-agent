[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"
ignore = [
    # Ignore time issue for now as there is no solution
    "RUSTSEC-2020-0071",
]
[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "BSL-1.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
]
deny = [
    "Nokia",
]
copyleft = "allow"
